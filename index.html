<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart - Avaliação de Estagiários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --bg-gradient: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 50%, #64748b 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-dark: #0f172a;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 20px;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.02em;
    }

    .header span {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text-dark);
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .form-group input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.15);
    }

    .btn-calc {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 16px rgba(29, 78, 216, 0.25);
    }

    .btn-calc:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.35);
    }

    .btn-calc:active {
      transform: scale(0.98);
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .badge {
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .badge-aprovado { background: #dcfce7; color: #166534; }
    .badge-reprovado { background: #fee2e2; color: #991b1b; }

    footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #334155;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="header">
      <span>TechStart Recursos Humanos</span>
      <h1>Cálculo de Desempenho</h1>
    </div>

    <div class="form-group">
      <label for="n1">1ª Avaliação</label>
      <input type="number" step="0.1" min="0" max="10" id="n1" placeholder="Ex: 8.5">
    </div>

    <div class="form-group">
      <label for="n2">2ª Avaliação</label>
      <input type="number" step="0.1" min="0" max="10" id="n2" placeholder="Ex: 7.0">
    </div>

    <div class="form-group">
      <label for="n3">3ª Avaliação</label>
      <input type="number" step="0.1" min="0" max="10" id="n3" placeholder="Ex: 9.0">
    </div>

    <div class="form-group">
      <label for="n4">4ª Avaliação</label>
      <input type="number" step="0.1" min="0" max="10" id="n4" placeholder="Ex: 6.5">
    </div>

    <button class="btn-calc" onclick="executarCalculo()">
      🧮 Calcular Média
    </button>

    <div class="result-box" id="resultado">
      <div class="result-item">
        <span>Média Final:</span>
        <strong id="media-valor">0.00</strong>
      </div>
      <div class="result-item">
        <span>Status (Booleano):</span>
        <span id="status-tag" class="badge">---</span>
      </div>
    </div>
  </div>

  <footer>
    &copy; TechStart &bull; Algoritmos de Fluxo Sequencial
  </footer>

  <script>
    function executarCalculo() {
      // 1. Entrada de Dados
      const nota1 = parseFloat(document.getElementById('n1').value) || 0;
      const nota2 = parseFloat(document.getElementById('n2').value) || 0;
      const nota3 = parseFloat(document.getElementById('n3').value) || 0;
      const nota4 = parseFloat(document.getElementById('n4').value) || 0;

      // 2. Processamento (Fluxo puramente sequencial)
      const media = (nota1 + nota2 + nota3 + nota4) / 4.0;
      const aprovado = media >= 7.0;

      // 3. Exibição / Saída
      document.getElementById('media-valor').innerText = media.toFixed(2);
      
      const statusTag = document.getElementById('status-tag');
      statusTag.innerText = aprovado ? "true (Aprovado)" : "false (Reprovado)";
      statusTag.className = `badge ${aprovado ? 'badge-aprovado' : 'badge-reprovado'}`;

      document.getElementById('resultado').style.display = 'block';
    }
  </script>
</body>
</html>
