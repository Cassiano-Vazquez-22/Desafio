<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStart - Avaliação de Desempenho</title>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      margin: 0;
      color: #f8fafc;
    }

    .container {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    h2 {
      margin-top: 0;
      text-align: center;
      font-size: 1.4rem;
      color: #38bdf8;
    }

    .campo {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }

    .resultado {
      margin-top: 20px;
      padding: 14px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      display: none;
    }

    .resultado p {
      margin: 6px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>TechStart • Cálculo de Médias</h2>

    <div class="campo">
      <label>1ª Nota:</label>
      <input type="number" id="n1" step="0.1" placeholder="0.0">
    </div>
    <div class="campo">
      <label>2ª Nota:</label>
      <input type="number" id="n2" step="0.1" placeholder="0.0">
    </div>
    <div class="campo">
      <label>3ª Nota:</label>
      <input type="number" id="n3" step="0.1" placeholder="0.0">
    </div>
    <div class="campo">
      <label>4ª Nota:</label>
      <input type="number" id="n4" step="0.1" placeholder="0.0">
    </div>

    <button id="btn-calcular">Calcular Média</button>

    <div class="resultado" id="painel-resultado">
      <p><strong>Média Final:</strong> <span id="out-media">0.00</span></p>
      <p><strong>Status de Aprovação:</strong> <span id="out-status">---</span></p>
    </div>
  </div>

  <!-- SCRIPT JAVASCRIPT EM FLUXO SEQUENCIAL -->
  <script>
    document.getElementById('btn-calcular').addEventListener('click', function() {
      // 1. ENTRADA DE DADOS (Ponto de partida / Leitura de variáveis)
      const nota1 = parseFloat(document.getElementById('n1').value) ;
      const nota2 = parseFloat(document.getElementById('n2').value) ;
      const nota3 = parseFloat(document.getElementById('n3').value) ;
      const nota4 = parseFloat(document.getElementById('n4').value) ;

      // 2. PROCESSAMENTO SEQUENCIAL (Sem usar IF/ELSE)
      const media = (nota1 + nota2 + nota3 + nota4) / 4.0;
      const aprovado = (media >= 7.0); // Retorna 'true' ou 'false' diretamente

      // 3. SAÍDA DE DADOS (Exibição dos resultados)
      document.getElementById('out-media').textContent = media.toFixed(2);
      document.getElementById('out-status').textContent = aprovado + " (true = Aprovado / false = Reprovado)";
      document.getElementById('painel-resultado').style.display = 'block';
      
      // PONTO DE PARADA: Fim da execução da função
    });
  </script>

</body>
</html>
